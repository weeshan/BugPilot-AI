<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>GitHub Issues | BugPilot AI</title>

    <link rel="stylesheet" href="/css/app.css">
<script src="/js/layout.js"></script>


<style>
.github-page {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
}

.github-page .subtitle {
    color: var(--text-tertiary, #999);
    margin: 0 0 25px;
    font-size: 14px;
}

.github-page .card {
    background: var(--bg-primary, #111113);
    border: 1px solid var(--border-card, #292929);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
}

.github-page h2 {
    font-size: 19px;
    margin: 0;
}

.github-page .card-description {
    color: var(--text-tertiary, #999);
    margin: 10px 0 24px;
    font-size: 14px;
}

.github-page .form {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    gap: 16px;
    align-items: end;
}

.github-page .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
}

.github-page label {
    font-size: 13px;
    font-weight: 600;
}

.github-page input {
    width: 100%;
    min-width: 0;
    height: 44px;
    background: var(--bg-primary, #101016);
    border: 1px solid var(--border-primary, #393944);
    border-radius: 8px;
    color: var(--text-primary, white);
    padding: 10px 12px;
    font: inherit;
}

.github-page input:focus {
    outline: 2px solid #7f56da;
}

.github-page button {
    min-height: 44px;
    background: #7f56da;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
}

.github-page button:hover {
    background: #9169e3;
}

.github-page button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.github-page .secondary {
    background: #292935;
}

.github-page .secondary:hover {
    background: #393947;
}

.github-page .status {
    min-height: 20px;
    margin-top: 16px;
    color: var(--text-tertiary, #aaa);
}

.github-page .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
}

.github-page .count {
    color: var(--text-tertiary, #999);
    margin: 8px 0 0;
    font-size: 13px;
}

.github-page .table-wrap {
    overflow-x: auto;
}

.github-page table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
}

.github-page th,
.github-page td {
    padding: 14px 12px;
    border-bottom: 1px solid var(--border-secondary, #292929);
    font-size: 13px;
    vertical-align: middle;
}

.github-page th {
    color: var(--text-tertiary, #aaa);
}

.github-page td {
    color: var(--text-primary, #ddd);
    overflow-wrap: anywhere;
}

.github-page td a {
    color: #ab9dca;
    text-decoration: none;
}

.github-page td a:hover {
    text-decoration: underline;
}

.github-page .state {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

.github-page .state.open {
    background: #153b2b;
    color: #86efac;
}

.github-page .state.closed {
    background: #39245c;
    color: #c4b5fd;
}

.github-page .empty {
    padding: 30px;
    text-align: center;
    color: var(--text-tertiary, #999);
}

@media (max-width: 760px) {
    .github-page .form {
        grid-template-columns: 1fr;
    }

    .github-page .card {
        padding: 16px;
    }
}
</style>

</head>

<body>

    <!-- NAVIGATION -->
<main id="app-content"><div class="github-page">



        <p class="subtitle">
            Import public GitHub repository issues into your
            BugPilot AI MySQL database.
            <span id="currentUser"></span>
        </p>

        <!-- IMPORT SECTION -->

        <section class="card">

            <h2>Import Issues</h2>

            <p class="card-description">
                Enter a public repository to retrieve its issues
                from the GitHub REST API.
            </p>

            <form id="importForm" class="form">

                <div class="field">

                    <label for="owner">
                        Repository owner
                    </label>

                    <input
                        id="owner"
                        type="text"
                        placeholder="microsoft"
                        maxlength="39"
                        required
                    >

                </div>

                <div class="field">

                    <label for="repo">
                        Repository name
                    </label>

                    <input
                        id="repo"
                        type="text"
                        placeholder="vscode"
                        maxlength="100"
                        required
                    >

                </div>

                <button id="importBtn" type="submit">
                    Import Issues
                </button>

            </form>

            <p
                id="importStatus"
                class="status"
                role="status"
                aria-live="polite"
            ></p>

        </section>

        <!-- MYSQL RESULTS SECTION -->

        <section class="card">

            <div class="toolbar">

                <div>
                    <h2>Imported Issues</h2>

                    <p class="count" id="issueCount">
                        Loading...
                    </p>
                </div>

                <button
                    id="refreshBtn"
                    class="secondary"
                    type="button"
                >
                    Refresh
                </button>

            </div>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Repository</th>
                            <th>Issue #</th>
                            <th>Title</th>
                            <th>State</th>
                            <th>GitHub</th>
                        </tr>
                    </thead>

                    <tbody id="issuesBody"></tbody>

                </table>

            </div>

        </section>

    </div></main>

    <script>

        // ==================================
        // ELEMENTS
        // ==================================

        const importForm =
            document.getElementById("importForm");

        const importBtn =
            document.getElementById("importBtn");

        const importStatus =
            document.getElementById("importStatus");

        const issuesBody =
            document.getElementById("issuesBody");

        const issueCount =
            document.getElementById("issueCount");

        const refreshBtn =
            document.getElementById("refreshBtn");

        // ==================================
        // LOAD CURRENT USER
        // ==================================

        async function loadCurrentUser() {
            try {
                const response = await fetch(
                    "/api/auth/me",
                    {
                        credentials: "same-origin",
                        cache: "no-store"
                    }
                );

                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }

                if (!response.ok) {
                    throw new Error("Could not load user.");
                }

                const result = await response.json();

                if (result.user) {
                    document.getElementById(
                        "currentUser"
                    ).textContent =
                        "Signed in as " +
                        result.user.username +
                        " (" + result.user.role + ").";
                }

            } catch (error) {
                console.error(
                    "Account lookup failed:",
                    error
                );
            }
        }

        // ==================================
        // DISPLAY TABLE CELL SAFELY
        // ==================================

        function addCell(row, value) {
            const cell = document.createElement("td");

            cell.textContent =
                value === null || value === undefined
                    ? ""
                    : String(value);

            row.appendChild(cell);

            return cell;
        }

        // ==================================
        // GET IMPORTED ISSUES FROM MYSQL
        // GET /api/github/issues
        // ==================================

        async function loadIssues() {

            issueCount.textContent = "Loading issues...";
            issuesBody.replaceChildren();

            try {

                const response = await fetch(
                    "/api/github/issues",
                    {
                        credentials: "same-origin",
                        cache: "no-store"
                    }
                );

                if (response.status === 401) {
                    window.location.href = "/login";
                    return;
                }

                if (!response.ok) {
                    throw new Error(
                        "Could not retrieve imported issues."
                    );
                }

                const result = await response.json();

                if (!result.success) {
                    throw new Error(
                        result.message || "Request failed."
                    );
                }

                const issues =
                    Array.isArray(result.data)
                        ? result.data
                        : [];

                issueCount.textContent =
                    String(issues.length) +
                    " saved issues displayed";

                if (issues.length === 0) {

                    const row =
                        document.createElement("tr");

                    const cell =
                        document.createElement("td");

                    cell.colSpan = 5;
                    cell.className = "empty";
                    cell.textContent =
                        "No imported issues found.";

                    row.appendChild(cell);
                    issuesBody.appendChild(row);

                    return;
                }

                issues.forEach(issue => {

                    const row =
                        document.createElement("tr");

                    // Repository
                    addCell(
                        row,
                        issue.repo_owner + "/" +
                        issue.repo_name
                    );

                    // GitHub issue number
                    addCell(
                        row,
                        "#" + issue.issue_number
                    );

                    // Title
                    addCell(row, issue.title);

                    // State
                    const stateCell =
                        document.createElement("td");

                    const stateLabel =
                        document.createElement("span");

                    stateLabel.className =
                        "state " +
                        (issue.state === "closed"
                            ? "closed"
                            : "open");

                    stateLabel.textContent =
                        issue.state || "unknown";

                    stateCell.appendChild(stateLabel);
                    row.appendChild(stateCell);

                    // Safe link
                    const linkCell =
                        document.createElement("td");

                    try {
                        const url = new URL(
                            issue.issue_url
                        );

                        if (
                            url.protocol === "https:" &&
                            url.hostname === "github.com"
                        ) {
                            const link =
                                document.createElement("a");

                            link.href = url.href;
                            link.target = "_blank";
                            link.rel =
                                "noopener noreferrer";
                            link.textContent =
                                "View Issue";

                            linkCell.appendChild(link);
                        }
                    } catch (error) {
                        // Invalid external URL:
                        // do not create a link.
                    }

                    row.appendChild(linkCell);

                    issuesBody.appendChild(row);
                });

            } catch (error) {

                issueCount.textContent =
                    error.message ||
                    "Failed to load issues.";
            }
        }

        // ==================================
        // IMPORT PUBLIC GITHUB ISSUES
        // POST /api/github/import
        // ==================================

        importForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                const owner =
                    document.getElementById("owner")
                        .value.trim();

                const repo =
                    document.getElementById("repo")
                        .value.trim();

                // Basic frontend validation
                if (
                    !/^[a-zA-Z0-9-]{1,39}$/.test(owner) ||
                    !/^[a-zA-Z0-9_.-]{1,100}$/.test(repo)
                ) {
                    importStatus.style.color = "#f87171";
                    importStatus.textContent =
                        "Enter a valid GitHub owner and repository.";
                    return;
                }

                importBtn.disabled = true;

                importStatus.style.color = "#a9a9b8";
                importStatus.textContent =
                    "Contacting GitHub API...";

                try {

                    const response = await fetch(
                        "/api/github/import",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            credentials: "same-origin",
                            body: JSON.stringify({
                                owner: owner,
                                repo: repo
                            })
                        }
                    );

                    if (response.status === 401) {
                        window.location.href = "/login";
                        return;
                    }

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            result.message ||
                            "GitHub import failed."
                        );
                    }

                    importStatus.style.color = "#86efac";
                    importStatus.textContent =
                        "Import completed for " +
                        owner + "/" + repo +
                        ". Saved issues are shown below.";

                    // Refresh the MySQL results via AJAX
                    await loadIssues();

                } catch (error) {

                    importStatus.style.color = "#f87171";
                    importStatus.textContent =
                        error.message ||
                        "Import failed.";

                } finally {
                    importBtn.disabled = false;
                }

            }
        );

        // ==================================
        // REFRESH WITHOUT RELOADING PAGE
        // ==================================

        refreshBtn.addEventListener(
            "click",
            loadIssues
        );

        // ==================================
        // INITIAL PAGE LOAD
        // ==================================


        (async () => {
            try {
                await BugPilotLayout.mount({
                    active: "github",
                    title: "GitHub Issues",
                    subtitle:
                        "Import public GitHub issues into BugPilot AI.",
                    breadcrumb: ["GitHub Issues"]
                });

                await loadCurrentUser();
                await loadIssues();

            } catch (error) {
                console.error(
                    "GitHub page failed to load:",
                    error
                );
            }
        })();


    </script>

</body>
</html>
